<style>
        body {
            background-color: #faf7f2;
            color: #1c1b1b;
        }
        
        .sticker-card {
            background-color: #ffffff;
            border: 4px solid #1c1b1b;
            box-shadow: 8px 8px 0px 0px #fd56a7;
            transition: transform 0.2s, box-shadow 0.2s;
            border-radius: 2rem;
        }
        .sticker-card:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px 0px #fd56a7;
        }

        .pill-btn {
            background-color: #ffffff;
            border: 4px solid #1c1b1b;
            box-shadow: 6px 6px 0px 0px rgba(28, 27, 27, 1);
            transition: all 0.2s;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
        }
        .pill-btn:hover {
            transform: translate(-2px, -2px) rotate(1deg);
            box-shadow: 8px 8px 0px 0px rgba(28, 27, 27, 1);
        }
        .pill-btn:active {
            transform: translate(6px, 6px);
            box-shadow: 0px 0px 0px 0px rgba(28, 27, 27, 1);
        }
        
        .pill-btn-primary {
            background-color: #630ed4;
            color: #ffffff;
        }
        .pill-btn-primary:hover {
            background-color: #7c3aed;
        }

        .step-container {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .step-container.active {
            display: block;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.8) rotate(-5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* Rainbow Background */
        .rainbow-path {
            fill: none;
            stroke-linecap: round;
            filter: url(#roughness);
        }

        .paper-texture {
            pointer-events: none;
            position: absolute;
            inset: 0;
            z-index: 50;
            opacity: 0.05;
            mix-blend-mode: multiply;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        @keyframes pulse-star {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.2) rotate(15deg); opacity: 1; }
        }
        .star-doodle {
            animation: pulse-star 3s ease-in-out infinite;
        }

        @keyframes draw-pipe {
            to { stroke-dashoffset: 0; }
        }
        .drawn-pipe {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw-pipe 3s forwards ease-in-out;
            filter: url(#roughness-subtle);
        }
        
        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 40px;
            width: 40px;
            border-radius: 50%;
            background: #fd56a7;
            border: 4px solid #1c1b1b;
            cursor: pointer;
            margin-top: -16px;
            box-shadow: 4px 4px 0px #1c1b1b;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 12px;
            cursor: pointer;
            background: #e5e2e1;
            border-radius: 6px;
            border: 4px solid #1c1b1b;
        }
    </style>

<div class="pill-btn px-8 py-4 rounded-full font-headline-sm text-headline-sm bg-tertiary-fixed transform -rotate-2">Tech ETF</div>
<div class="pill-btn px-8 py-4 rounded-full font-headline-sm text-headline-sm bg-secondary-fixed transform rotate-1">Crypto Basket</div>
<div class="pill-btn px-8 py-4 rounded-full font-headline-sm text-headline-sm bg-primary-fixed transform -rotate-1">Space X Acc</div>
</div>
<button class="pill-btn bg-on-background text-surface-container-lowest px-12 py-6 rounded-full font-display-xl text-3xl italic shadow-[8px_8px_0px_0px_#fd56a7] hover:shadow-[12px_12px_0px_0px_#fd56a7] transition-all flex items-center justify-center gap-4 mx-auto uppercase relative z-20">
                enter war room <span class="material-symbols-outlined text-4xl">arrow_forward</span>
</button>
</div>
</div>
</main>
<script>
        function nextStep(step) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.getElementById('current-step-indicator').innerText = step;
            
            if(step === 4) {
                 createConfetti();
            }
        }

        function prevStep(step) {
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.getElementById('current-step-indicator').innerText = step;
        }

        function createConfetti() {
            const colors = ['#fd56a7', '#630ed4', '#aa4900', '#1c1b1b', '#ffdbca'];
            const shapes = ['square', 'circle', 'triangle'];
            for(let i=0; i<80; i++) {
                let conf = document.createElement('div');
                conf.style.position = 'absolute';
                conf.style.width = Math.random() * 15 + 10 + 'px';
                conf.style.height = conf.style.width;
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                let shape = shapes[Math.floor(Math.random() * shapes.length)];
                if (shape === 'circle') conf.style.borderRadius = '50%';
                if (shape === 'triangle') {
                    conf.style.width = '0';
                    conf.style.height = '0';
                    conf.style.backgroundColor = 'transparent';
                    conf.style.borderLeft = `${Math.random() * 10 + 5}px solid transparent`;
                    conf.style.borderRight = `${Math.random() * 10 + 5}px solid transparent`;
                    conf.style.borderBottom = `${Math.random() * 15 + 10}px solid ${colors[Math.floor(Math.random() * colors.length)]}`;
                }

                if(Math.random() > 0.5) conf.style.border = '2px solid #1c1b1b';

                conf.style.top = '-50px';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.opacity = Math.random() * 0.5 + 0.5;
                conf.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
                conf.style.zIndex = '50';
                
                document.body.appendChild(conf);
                
                let duration = Math.random() * 3 + 2;
                conf.animate([
                    { transform: `translate3d(0,0,0) rotate(0deg) scale(1)`, opacity: 1 },
                    { transform: `translate3d(${Math.random()*300 - 150}px, 120vh, 0) rotate(${Math.random()*1080}deg) scale(${Math.random()})`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(.37,0,.63,1)',
                    fill: 'forwards'
                });
                
                setTimeout(() => conf.remove(), duration * 1000);
            }
        }
    </script>
</body></html>
